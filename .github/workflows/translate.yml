name: Auto-translate GitLab repo strings

# This workflow lives in a GitHub repo, but translates a repo that lives on GitLab.
#   * Reads the GitLab repo (branch you type when starting the run)
#   * Translates new/edited strings into es, de, ru, fil, ar, id  (free, no API key)
#   * Pushes the result to a NEW branch in the GitLab repo: n/1, n/2, n/3 ...
#     (first free number), one commit per language.
#   * If any language is incomplete, nothing is pushed.
#
# One-time setup: add a GitHub secret named GITLAB_TOKEN (see README / chat steps).

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "GitLab branch to translate (source branch), e.g. main"
        required: true
        default: "main"
        type: string
      langs:
        description: "Language suffixes (blank = all: es de ru fil ar id)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  # <-- your GitLab project path:  namespace/project
  GITLAB_PROJECT: yusufnoor786/packages_apps_Mistify

concurrency:
  group: auto-translate
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      langs: ${{ steps.l.outputs.langs }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: tool

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: l
        env:
          INPUT_LANGS: ${{ inputs.langs }}
          SRC_BRANCH: ${{ inputs.branch }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "::error::GitHub secret GITLAB_TOKEN is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          URL="https://oauth2:${GITLAB_TOKEN}@gitlab.com/${GITLAB_PROJECT}.git"
          if ! git ls-remote --exit-code --heads "$URL" "refs/heads/${SRC_BRANCH}" >/dev/null 2>&1; then
            echo "::error::Cannot read branch '${SRC_BRANCH}' of GitLab project ${GITLAB_PROJECT}. Check the branch name and that GITLAB_TOKEN is valid."
            exit 1
          fi
          if [ -n "$INPUT_LANGS" ]; then
            LANGS=$(python3 -c "import json,os; print(json.dumps(os.environ['INPUT_LANGS'].replace(',', ' ').split()))")
          else
            LANGS=$(python3 tool/translate_strings.py --list)
          fi
          echo "langs=$LANGS" >> "$GITHUB_OUTPUT"
          echo "GitLab project: ${GITLAB_PROJECT} | source branch: ${SRC_BRANCH} | languages: $LANGS"

  translate:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 6            # be gentle with the free endpoint
      matrix:
        lang: ${{ fromJson(needs.setup.outputs.langs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: tool

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install deep-translator

      - name: Clone the GitLab repo
        env:
          SRC_BRANCH: ${{ inputs.branch }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git clone --quiet --depth 1 --branch "$SRC_BRANCH" \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.com/${GITLAB_PROJECT}.git" repo
          echo "Translating GitLab project ${GITLAB_PROJECT} @ ${SRC_BRANCH} -> ${{ matrix.lang }}"

      - name: Translate new / changed strings (${{ matrix.lang }})
        working-directory: repo
        env:
          WORKERS: "4"
          MAX_MINUTES: "300"
          ROUNDS: "4"
          GLOSSARY_FILE: ${{ github.workspace }}/tool/translate_glossary.txt
        # exits 1 if ANY string is missing or the translator returned English
        run: python "$GITHUB_WORKSPACE/tool/translate_strings.py" "${{ matrix.lang }}"

      - name: Package results
        working-directory: repo
        run: |
          git ls-files -m -o --exclude-standard | grep -v '__pycache__' > "$RUNNER_TEMP/changed.txt" || true
          if [ -s "$RUNNER_TEMP/changed.txt" ]; then
            tar czf "$RUNNER_TEMP/tr-${{ matrix.lang }}.tgz" -T "$RUNNER_TEMP/changed.txt"
          else
            mkdir -p "$RUNNER_TEMP/empty"
            tar czf "$RUNNER_TEMP/tr-${{ matrix.lang }}.tgz" -C "$RUNNER_TEMP/empty" .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tr-${{ matrix.lang }}
          path: ${{ runner.temp }}/tr-${{ matrix.lang }}.tgz
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [setup, translate]      # runs only if EVERY language succeeded
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tool

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          pattern: tr-*
          path: ${{ runner.temp }}/tr

      - name: Clone the GitLab repo
        env:
          SRC_BRANCH: ${{ inputs.branch }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git clone --quiet --branch "$SRC_BRANCH" \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.com/${GITLAB_PROJECT}.git" repo

      - name: Create next n/<number> branch on GitLab, one commit per language
        working-directory: repo
        env:
          SRC_BRANCH: ${{ inputs.branch }}
          LANGS_JSON: ${{ needs.setup.outputs.langs }}
        run: |
          set -euo pipefail
          git config user.name  "Zabuka_zuzu"
          git config user.email "zuzu950444@gmail.com"

          # First free number: n/1 if it doesn't exist, else n/2, else n/3 ...
          EXISTING=$(git ls-remote --heads origin 'refs/heads/n/*' | sed 's#.*refs/heads/##' || true)
          N=1
          while grep -qxF "n/$N" <<< "$EXISTING"; do N=$((N + 1)); done
          NEW="n/$N"
          START=$(git rev-parse HEAD)
          git checkout -q -b "$NEW"

          for L in $(python3 -c 'import json,os; print(" ".join(json.loads(os.environ["LANGS_JSON"])))'); do
            NAME=$(python3 "$GITHUB_WORKSPACE/tool/translate_strings.py" --name "$L")
            tar xzf "$RUNNER_TEMP/tr/tr-$L/tr-$L.tgz" -C .
            git add -A
            if git diff --cached --quiet; then
              echo "No new strings for $NAME ($L) - no commit."
              continue
            fi
            COUNT=$(git diff --cached -U0 -- '*.xml' | grep -cE '^\+.*<(string|string-array|plurals) ' || true)
            git commit -q \
              -m "Add $NAME ($L) translations" \
              -m "Auto-translated $COUNT string(s) from the English res/values string files with deep-translator (free Google Translate endpoint). Placeholders and glossary terms preserved. Incremental state: .translate-state/$L.json"
            echo "Committed $NAME ($L): $COUNT string(s)"
          done

          if [ "$(git rev-parse HEAD)" = "$START" ]; then
            echo "Nothing new to translate - no branch created."
            echo "Nothing new to translate on \`$SRC_BRANCH\` - no branch created." >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 0
          fi

          git push --quiet origin "$NEW"
          {
            echo "### ✅ Pushed \`$NEW\` to GitLab (${GITLAB_PROJECT}, from \`$SRC_BRANCH\`)"
            git log --oneline "$START..HEAD"
            echo ""
            echo "Open a merge request: https://gitlab.com/${GITLAB_PROJECT}/-/merge_requests/new?merge_request%5Bsource_branch%5D=${NEW}&merge_request%5Btarget_branch%5D=${SRC_BRANCH}"
            echo ""
            echo "Tip: next time, run with branch = \`$NEW\` (or merge it first) so it stays incremental."
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "Pushed $NEW"
